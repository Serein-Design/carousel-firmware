# SPDX-License-Identifier: AGPL-3.0-only
name: release

# A tag v1.2.3 builds the firmware, signs it for the panels' updater and
# publishes a GitHub release. Panels read releases/latest/download/manifest.json.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.19 esptool==4.5.1
      - name: Build
        env:
          FIRMWARE_VERSION: ${{ github.ref_name }}
        run: pio run -d firmware -e carousel
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: >
          bash firmware/scripts/sign_release.sh firmware/.pio/build/carousel/firmware.bin
          "${{ github.ref_name }}" "${{ github.repository }}" dist
      - name: Factory image (blank board, flashed over USB at 0x0)
        run: |
          B=firmware/.pio/build/carousel
          python -m esptool --chip esp32 merge_bin -o "dist/carousel-${{ github.ref_name }}-factory.bin" \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
