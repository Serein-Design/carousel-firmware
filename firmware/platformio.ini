; SPDX-License-Identifier: AGPL-3.0-only
; Carousel - HUB75 64x32 (P3) LED panel on ESP32-WROOM
;
;   Build                 : pio run
;   Build + flash (cable) : pio run -t upload        (manual BOOT/EN, see below)
;   Build + flash (Wi-Fi) : pio run -e carousel-ota -t upload --upload-port <panel IP>
;   Serial monitor        : pio device monitor
;   Panel hardware test   : pio run -e hwtest -t upload
;   Host unit tests       : pio test -e native
;
; The serial port is auto-detected. If several boards are plugged in, pass
; --upload-port / --port, or set PLATFORMIO_UPLOAD_PORT in your shell.

[platformio]
default_envs = carousel

; Shared by the ESP32 environments
[esp32]
platform  = espressif32@6.10.0
board     = esp32dev
framework = arduino

monitor_speed   = 115200
; Decodes crash backtraces and timestamps every line
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; Flashing
;
; BOARD SCHEMATIC (checked 2026-09-20): there is NO auto-reset circuit.
; EN (R7 10k + C7 1uF + button S1) and IO0 (R8 10k + C8 1uF + button S2) are
; only wired to buttons; the adapter's DTR and RTS go nowhere. Download mode is
; therefore ALWAYS entered by hand, while esptool prints "Connecting":
;   1. hold BOOT (S2)   2. short press on EN (S1)   3. release BOOT
;
; --before=no_reset is therefore mandatory. NEVER add --no-stub: without the
; stub, the ROM bootloader watchdog reboots the chip mid-transfer and the write
; dies somewhere between 10 and 90 %.
; --after=no_reset avoids ending on a "hard reset via RTS" that does nothing
; here: press EN by hand to start the program.
;
; 115200 all the way: on this board, switching to 460800/921600 breaks the link
; ("Invalid head of packet" right after "Changing baud rate").
; --connect-attempts=0 waits for the BOOT/EN dance forever instead of failing.
; ---------------------------------------------------------------------------
upload_speed = 115200
upload_flags =
    --before=no_reset
    --after=no_reset
    --connect-attempts=0

lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

extra_scripts = pre:scripts/version.py

; Partition table, see partitions.csv: two 1.75 MB OTA slots, 384 KB of
; files. Only a cable flash changes a board's table.
board_build.partitions = partitions.csv
; Root certificates for HTTPS (scripts/gen_crt_bundle.py), see certs.h
board_build.embed_files = certs/x509_crt_bundle.bin

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Panel colour depth: 8 by default; each bit less sharply raises the refresh
    ; rate (fewer sub-frames to display). 6 is a good trade-off; drop to 5 if
    ; flicker is still visible, go back to 8 if gradients get too coarse.
    -DPIXEL_COLOR_DEPTH_BITS=6
; Our sources only: the libraries' own warnings are not ours to fix. The
; unused-* errors are spelled out because the Arduino core downgrades them.
build_src_flags = -Wall -Wextra -Werror -Werror=unused-variable -Werror=unused-function

; Main firmware (src/)
[env:carousel]
extends = esp32

; Same firmware, uploaded over Wi-Fi. Needs OTA_PASSWORD in include/secrets.h
; (read by scripts/ota_auth.py) and a firmware with OTA already on the board.
; carousel.local works when mDNS answers; otherwise pass --upload-port <IP>.
[env:carousel-ota]
extends = esp32
upload_protocol = espota
upload_port = carousel.local
upload_flags =
extra_scripts =
    pre:scripts/version.py
    pre:scripts/ota_auth.py

; Standalone panel test: colours, geometry, text, scan (hwtest/)
[env:hwtest]
extends = esp32
build_src_filter = -<*> +<../hwtest/>

; Host-side unit tests of the hardware-independent modules (test/), built
; against the Arduino stand-ins in test/stubs
[env:native]
platform = native
test_framework = unity
; AddressSanitizer: memory errors in host-tested parsers (GIF, uploads) fail the
; test instead of passing by luck.
build_flags = -std=gnu++17 -I test/stubs -fsanitize=address -fno-omit-frame-pointer
